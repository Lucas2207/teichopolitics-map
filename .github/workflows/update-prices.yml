name: Update cost prices

on:
  schedule:
    - cron: "17 7 * * *" # daily; nothing changes until both indices have a new month
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recalculate costs at the latest published prices
        run: python3 scripts/update_prices.py
      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/barriers.geojson data/price-base.json data/price-index.json index.html
          git commit -m "Costs updated to the latest published prices"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
